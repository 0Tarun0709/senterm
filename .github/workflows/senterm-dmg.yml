name: senterm macos dmg

on:
  push:
    branches: [main, senterm]
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-alpha.[0-9]+'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    if: github.repository == '0Tarun0709/senterm'
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash test/senterm-review/run.sh

  build:
    needs: test
    if: github.ref == 'refs/heads/main' || github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
      - name: prepare toolchain
        run: |
          xcodebuild -version
          if ! xcrun metal --version >/dev/null 2>&1; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          xcrun metal --version
          brew install nushell
          node --version
          nu --version
      - name: build universal app
        run: |
          set --
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            # SenTerm tags use a version independent of Ghostty.
            set -- "-Dversion-string=${GITHUB_REF_NAME#v}"
          fi
          zig build -Doptimize=ReleaseFast -Demit-macos-app=false -Dxcframework-target=universal "$@"
          nu macos/build.nu --configuration ReleaseLocal
      - name: package disk image
        run: |
          mkdir -p dist
          bash macos/package-dmg.sh macos/build/ReleaseLocal/senterm.app \
            "$PWD/dist/senterm-macos-universal.dmg"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: senterm-macos-universal
          path: dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  draft-release:
    if: github.repository == '0Tarun0709/senterm' && github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: senterm-macos-universal
          path: dist/
      - name: draft github release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          (cd dist && sha256sum -c senterm-macos-universal.dmg.sha256)
          set --
          if [[ "$GITHUB_REF_NAME" == *-alpha.* ]]; then
            set -- --prerelease
          fi
          gh release create "$GITHUB_REF_NAME" --verify-tag --draft "$@" \
            --title "SenTerm $GITHUB_REF_NAME" \
            --notes 'test build: ad-hoc signed, not notarized. smoke-test before publishing.' \
            dist/senterm-macos-universal.dmg dist/senterm-macos-universal.dmg.sha256
